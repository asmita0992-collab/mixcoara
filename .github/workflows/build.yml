name: Compilar APK Android

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Generar APK firmado de release
    runs-on: ubuntu-24.04
    steps:
      - name: Obtener el código
        uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Instalar Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Decodificar Keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android-app/app/mi-release.jks

      - name: Crear keystore.properties
        working-directory: android-app
        run: |
          echo "storeFile=mi-release.jks" > keystore.properties
          echo "storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> keystore.properties
          echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}" >> keystore.properties
          echo "keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}" >> keystore.properties

      - name: Incrementar versión
        working-directory: android-app
        run: gradle --no-daemon incrementVersion

      - name: Guardar cambios de versión en el repositorio
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add android-app/app/version.properties
          git commit -m "Incrementar build automáticamente [skip ci]" || echo "No hay cambios para confirmar"
          git push

      - name: Compilar APK
        working-directory: android-app
        run: gradle --no-daemon --max-workers=2 clean assembleRelease

      - name: Guardar el APK compilado
        uses: actions/upload-artifact@v4
        with:
          name: Archivos-APK-Generados
          path: android-app/app/build/outputs/apk/release/*.apk
          if-no-files-found: error