name: Compilar APK Android

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Generar APK de depuración
    runs-on: ubuntu-24.04
    steps:
      - name: Obtener el código
        uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Instalar Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Incrementar versión
        # Ejecutamos Gradle en la raíz del proyecto android-app donde está el gradlew/settings.gradle
        working-directory: android-app
        run: gradle --no-daemon incrementVersion

      - name: Guardar cambios de versión en el repositorio
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Ruta exacta del archivo dentro de la carpeta app
          git add android-app/app/version.properties
          
          # Agregamos [skip ci] para evitar que un push del bot dispare otro workflow por error
          git commit -m "Incrementar build automáticamente [skip ci]" || echo "No hay cambios para confirmar"
          git push

      - name: Compilar APK
        working-directory: android-app
        run: gradle --no-daemon --max-workers=2 clean assembleDebug

      - name: Guardar el APK compilado
        uses: actions/upload-artifact@v4
        with:
          name: Archivos-APK-Generados
          path: android-app/app/build/outputs/apk/**/*.apk
          if-no-files-found: error